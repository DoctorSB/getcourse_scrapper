# Scraper + web UI + Yandex Disk upload job, all in one container.
#
#   docker compose up -d --build
#   open http://127.0.0.1:4321
#
# The port is published to 127.0.0.1 only: the UI drives a browser logged into
# your account, so it must not be reachable from the network.

services:
  scraper:
    build: .
    image: getcourse-scraper:local
    container_name: getcourse-scraper
    restart: unless-stopped

    ports:
      - "127.0.0.1:4321:4321"

    env_file:
      - .env

    environment:
      # Paths inside the container; host paths come from the volumes below.
      SCRAPPER_DOWNLOAD_PATH: /data/download
      SCRAPPER_UI_HOST: 0.0.0.0
      SCRAPPER_UI_PORT: 4321

    volumes:
      # Videos land here and are removed again once uploaded to Yandex Disk.
      - ./download:/data/download
      # Discovered lesson lists, so they survive a rebuild.
      - ./config/trainings:/app/config/trainings
      - ./logs:/app/logs
      # Session and Disk token, created through the UI.
      - ./auth-state.json:/app/auth-state.json
      - ./yadisk-auth.json:/app/yadisk-auth.json

    # Chromium needs more than the default 64 MB of shared memory.
    shm_size: 1gb

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4321/api/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
